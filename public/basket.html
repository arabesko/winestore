<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennylane | Shopping Basket</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header and main navigation -->
    <header>
        <h1>Pennylane</h1>
        <p>Good drinks. Great company.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="wines.html">Wine Shop</a>
            <a href="booking.html">Contact</a>
            <a href="login.html" id="loginLink">Login</a>
            <a href="basket.html">Basket</a>
        </nav>
    </header>

    <!-- Shopping basket section -->
    <main class="basket-section">

        <h2>Your Shopping Basket</h2>

        <!-- Container for basket products -->
        <div id="basket-items"></div>

        <!-- Display the total basket price -->
        <div class="basket-summary">
            <h3>Total: €<span id="basket-total">0.00</span></h3>

            <!-- Button to complete the purchase -->
            <button id="checkout-button">Proceed to Checkout</button>
        </div>

    </main>

    <!-- Website footer -->
    <footer>
        <p>Pennylane | Dublin, Ireland</p>
    </footer>

    <!-- Manage the user session -->
    <script src="session.js"></script>

    <!-- Manage the shopping basket -->
    <script src="basket.js"></script>

</body>

</html>
