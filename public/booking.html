<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennylane | Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Bar Navigation -->
    <header>
        <h1>Pennylane</h1>
        <p>Good drinks. Great company.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="wines.html">Wine Shop</a>
            <a href="booking.html">Contact</a>
            <a href="login.html" id="loginLink">Login</a>
            <a href="basket.html">Basket</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact</h2>
            <p>Contact with Pennylane</p>

            <!-- Contact Form -->
            <form class="booking-form" id="contactForm" onsubmit="return validateForm()" novalidate>

                <!-- Name title and input -->
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <!-- Email title and input -->
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <!-- Phona title and input -->
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="85XXXXXXX" required>

                <!-- Reason title and input -->
                <label for="reason">Reason for enquiry</label>
                <textarea id="reason" name="reason" rows="4" placeholder="Tell us about your visit"></textarea>

                <!-- Buttom request -->
                <button type="submit">Send request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Pennylane, Dublin</p>
        <a href="https://www.instagram.com/pennylane_dublin">Follow us in Instagram</a>
    </footer>

    <!-- Connect the session management script -->
    <script src="session.js"></script>
</body>

</html>
