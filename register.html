<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define the browser tab title -->
    <title>Pennylane | Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Shared header and navigation -->
    <header>
        <h1>Pennylane</h1>
        <p>Good drinks. Great company.</p>

        <!-- Main navigation menu -->
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="wines.html">Wine Shop</a>
            <a href="booking.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="basket.html">Basket</a>
        </nav>
    </header>

    <!-- Main content of the registration page -->
    <main>

        <!-- Registration section -->
        <section class="register-section">

            <h2>Create an Account</h2>
            <p>Register to start shopping at Pennylane.</p>

            <!-- Form to collect user information -->
            <form id="registerForm">

                <!-- Full name is required -->
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" maxlength="100" required>

                <!-- Validate the email format -->
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" maxlength="150" required>

                <!-- Hide the password and require at least 8 characters -->
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="8" maxlength="15"
                    oninvalid="this.setCustomValidity('Password must have between 8 and 15 characters')"
                    oninput="this.setCustomValidity('')" required>

                <!-- Ask the user to confirm the password -->
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="8"
                    maxlength="15" oninvalid="this.setCustomValidity('Password must have between 8 and 15 characters')"
                    oninput="this.setCustomValidity('')" required>

                <!-- Submit the registration form -->
                <button type="submit">Register</button>

            </form>

            <!-- Redirect existing users to the login page -->
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </section>

    </main>

    <!-- Shared footer -->
    <footer>
        <p>Pennylane, Dublin</p>
        <a href="https://www.instagram.com/pennylane_dublin">
            Follow us in Instagram
        </a>
    </footer>

    <!-- Connect the registration JavaScript file -->
    <script src="register.js"></script>

</body>

</html>
